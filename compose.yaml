services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mobility_guard
      POSTGRES_USER: mobility_guard
      POSTGRES_PASSWORD: mobility_guard
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobility_guard -d mobility_guard"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn mobility_guard.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://mobility_guard:mobility_guard@postgres:5432/mobility_guard
      REDIS_URL: redis://redis:6379/0
      ASYNC_EXPLANATION_ENABLED: "true"
      API_KEY: ${API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: celery -A mobility_guard.infrastructure.task_queue:celery_app worker --loglevel=INFO
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://mobility_guard:mobility_guard@postgres:5432/mobility_guard
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: http://api:8000
      API_KEY: ${API_KEY:-}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
