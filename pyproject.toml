[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mobility-guard"
version = "0.1.0"
description = "API de análise inteligente de cobranças de mobilidade"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2.0",
  "celery[redis]>=5.5,<6.0",
  "fastapi>=0.116,<1.0",
  "openai>=2.0,<3.0",
  "prometheus-client>=0.22,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.10,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.17,<2.0",
  "pytest>=8.4,<10.0",
  "pytest-cov>=6.2,<8.0",
  "ruff>=0.12,<1.0",
]

[project.scripts]
mobility-guard = "mobility_guard.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mobility_guard"]

[tool.pytest.ini_options]
addopts = "-q --cov=mobility_guard --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
